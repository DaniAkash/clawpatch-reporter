# PR CI. Auto-runs on every push to an open PR and on the push that
# closes one.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `if: ${{ !cancelled() }}` on every step below is deliberate. One CI
  # run surfaces every failure in the diff (lint + typecheck + tests +
  # build), so the next push can fix all of them at once instead of
  # one-per-cycle.
  checks:
    name: Lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # No version specified. Reads .bun-version from the repo root.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: oxlint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: tsc --noEmit
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: vitest
        if: ${{ !cancelled() }}
        run: bun run test

      - name: bunup build
        if: ${{ !cancelled() }}
        run: bun run build
