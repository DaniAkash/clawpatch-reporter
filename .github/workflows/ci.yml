# PR CI. Auto-runs on every push to an open PR and on the push that
# closes one.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `if: ${{ !cancelled() }}` on every step below is deliberate. One CI
  # run surfaces every failure in the diff (lint + typecheck + tests +
  # build), so the next push can fix all of them at once instead of
  # one-per-cycle.
  checks:
    name: Lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        # Install via the official curl script instead of oven-sh/setup-bun
        # to avoid Actions codeload flakiness when resolving action SHAs.
        # The version comes from .bun-version so updates stay a one-line
        # change reviewed like any other source change.
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v$(cat .bun-version)"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: oxlint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: tsc --noEmit
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: vitest
        if: ${{ !cancelled() }}
        run: bun run test

      - name: bunup build
        if: ${{ !cancelled() }}
        run: bun run build
