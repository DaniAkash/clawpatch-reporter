# Tag-triggered npm release + draft GitHub Release.
#
# How to cut a release:
#   1. Bump version in package.json
#   2. Commit ("chore(release): X.Y.Z"). The chore(release) prefix is
#      filtered out of cliff.toml so the bump commit does not pollute
#      the next changelog.
#   3. git tag vX.Y.Z && git push origin main --tags
#         e.g. v0.0.1
#   4. Wait for the workflow to finish, then publish the draft from the
#      Releases page.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   NPM_TOKEN: automation token for npmjs.com with publish access
#
# Required repo settings:
#   Settings -> Actions -> General -> Workflow permissions -> Read and
#   write permissions (so id-token: write below works for npm
#   provenance).

name: Release (npm publish + draft GitHub release)

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  id-token: write   # required for npm provenance attestations

jobs:
  release:
    name: Verify, publish, and draft release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so git-cliff (and git describe) can
          # walk back to the previous tag and compute the changelog
          # range.
          fetch-depth: 0

      - name: Install Bun
        # Install via the official curl script instead of oven-sh/setup-bun
        # to avoid Actions codeload flakiness when resolving action SHAs.
        # The version comes from .bun-version so updates stay a one-line
        # change reviewed like any other source change.
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v$(cat .bun-version)"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install Node + npm (for the publish step)
        # ubuntu-latest already ships npm, but setup-node pins the
        # version explicitly and writes ~/.npmrc with the npmjs
        # registry URL + ${NODE_AUTH_TOKEN} placeholder, which is
        # cleaner than echoing the token ourselves. All other steps
        # use Bun. Node is here only because bun publish's auth
        # handling on Bun 1.3.x does not read NPM_TOKEN reliably.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-run the full check suite before publishing. A green tag must
      # mean a green workspace. Never trust the PR-time CI alone since
      # post-merge changes can shift state.
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build

      - name: Determine previous tag (for changelog range)
        id: previous_tag
        run: |
          set +e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" "${GITHUB_REF_NAME}^" 2>/dev/null)
          set -e
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "first_release=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag found. This is the first release."
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Generate changelog (subsequent releases only)
        if: steps.previous_tag.outputs.first_release == 'false'
        id: changelog
        # git-cliff parses conventional-commit messages between the
        # previous tag and the new tag, groups them by type per
        # cliff.toml, and exposes the rendered markdown as
        # steps.changelog.outputs.content.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip header ${{ steps.previous_tag.outputs.previous_tag }}..${{ github.ref_name }}

      - name: Publish to npm
        env:
          # setup-node writes a ~/.npmrc that interpolates
          # ${NODE_AUTH_TOKEN} (not NPM_TOKEN) at publish time, so this
          # is the env-var name we have to use.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --access public is required for unscoped or fresh-scoped
        # packages on the free tier. --provenance attaches an
        # OIDC-signed provenance attestation so npm shows the "built
        # and signed on a cloud builder" badge. publishConfig in
        # package.json sets both by default, but pass them on the CLI
        # too as belt and braces.
        run: npm publish --access public --provenance

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # DRAFT. Never auto-publish. Review the body in the GitHub UI
          # and click Publish when ready.
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # First release goes out with the literal "first release"
          # body. Otherwise the git-cliff-rendered changelog. The ||
          # fallback fires when the changelog step was skipped (its
          # output is empty).
          body: ${{ steps.changelog.outputs.content || 'first release' }}
